name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # runs every time you push to main

# ── Required permissions for the modern Pages deploy API ──
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── JOB 1: Build with Eleventy ─────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:

      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build Eleventy site
        run: npm run build

      - name: ⬆️ Upload _site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site        # Eleventy outputs here

  # ── JOB 2: Deploy the artifact to GitHub Pages ────────────
  deploy:
    needs: build                # wait for build to finish
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
