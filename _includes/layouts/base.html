<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ description | default("Aryan's awesome kids blog – stories, art, quizzes & games!") }}" />
  <meta property="og:title" content="{{ title }} | Aryan's Blog" />
  <meta property="og:description" content="{{ description | default("Aryan's awesome kids blog!") }}" />
  <meta property="og:type" content="website" />
  <title>{{ title }} | ⭐ Aryan's Blog</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/kids-theme.css" />
  <link rel="stylesheet" href="/assets/css/quiz-cards.css" />
  <link rel="stylesheet" href="/assets/css/puzzle-styles.css" />

  <!-- Favicon emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>" />
</head>
<body>

  {% include "header.html" %}

  <main class="site-main">
    {{ content | safe }}
  </main>

  {% include "footer.html" %}

  <!-- Global JS -->
  <script src="/assets/js/main.js"></script>
</body>
</html>
